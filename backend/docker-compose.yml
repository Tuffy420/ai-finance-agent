version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finpilot_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://finpilot:finpilot_pass@postgres:5432/finpilot_db
      - SYNC_DATABASE_URL=postgresql://finpilot:finpilot_pass@postgres:5432/finpilot_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=finpilot_super_secret_jwt_key_32_bytes_long_minimum!!
      - ENCRYPTION_KEY=D7z1bM3bQ5r7s9v1x3z5b7d9f1h3j5l7n9p1r3t5v7x=
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  postgres:
    image: postgres:16-alpine
    container_name: finpilot_postgres
    restart: always
    environment:
      POSTGRES_USER: finpilot
      POSTGRES_PASSWORD: finpilot_pass
      POSTGRES_DB: finpilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpilot -d finpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finpilot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finpilot_celery_worker
    command: celery -A app.services.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://finpilot:finpilot_pass@postgres:5432/finpilot_db
      - SYNC_DATABASE_URL=postgresql://finpilot:finpilot_pass@postgres:5432/finpilot_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - app
      - redis
      - postgres

volumes:
  postgres_data:
  redis_data:
